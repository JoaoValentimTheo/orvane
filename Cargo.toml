[workspace]
resolver = "3"
members = [
    "crates/orv-syntax",
    "crates/orv-sema",
    "crates/orv-runtime",
    "crates/orv-py",
    "crates/orv-cli",
    "crates/orv-pymod",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orvane/orvane"
description = "Orvane: an intent-oriented language with bidirectional Python interop."
authors = ["Orvane contributors"]

[workspace.dependencies]
orv-syntax = { path = "crates/orv-syntax" }
orv-sema = { path = "crates/orv-sema" }
orv-runtime = { path = "crates/orv-runtime" }
orv-py = { path = "crates/orv-py" }
orv-pymod = { path = "crates/orv-pymod" }

thiserror = "2.0.20"
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1.48.0"
proptest = "1.11.0"
